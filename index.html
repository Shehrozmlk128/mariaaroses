<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Maria 🌸</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(135deg, #fff0f5, #ffe6ee);
    font-family: 'Segoe UI', sans-serif;
}

/* FLOAT */
@keyframes floatUp {
    0% { transform: translateY(110vh) translateX(0); }
    50% { transform: translateY(50vh) translateX(10px); }
    100% { transform: translateY(-220px) translateX(0); }
}

/* HEARTS */
.heart {
    position: absolute;
    font-size: 22px;
    color: #ff69b4;
    opacity: 0.8;
    animation: floatUp linear infinite;
}

/* NAME */
.name {
    position: absolute;
    font-size: 42px;
    color: #d63384;
    font-weight: 600;
    opacity: 0.25;
    animation: floatUp linear infinite;
    pointer-events: none;
}

/* ROSE */
.rose {
    position: absolute;
    width: 50px;
    height: 120px;
    animation: floatUp linear infinite;
}

.flower {
    position: relative;
    width: 50px;
    height: 45px;
    margin: auto;
}

.petal {
    position: absolute;
    width: 16px;
    height: 30px;
    border-radius: 60% 60% 40% 40%;
    top: 6px;
    left: 17px;
}

.pink .petal {
    background: linear-gradient(to top, #f28bb2, #ffd1e3);
}

.white .petal {
    background: linear-gradient(to top, #f7f7f7, #ffffff);
}

.petal:nth-child(1) { transform: rotate(-50deg); left: 5px; }
.petal:nth-child(2) { transform: rotate(-20deg); left: 10px; }
.petal:nth-child(3) { transform: rotate(0deg); }
.petal:nth-child(4) { transform: rotate(20deg); left: 24px; }
.petal:nth-child(5) { transform: rotate(50deg); left: 29px; }

.inner {
    width: 12px;
    height: 22px;
    top: 12px;
    left: 19px;
    opacity: 0.9;
}

/* STEM */
.stem {
    position: absolute;
    width: 3px;
    height: 60px;
    background: linear-gradient(to bottom, #3a8f5a, #2e6f46);
    left: 50%;
    top: 48px;
    transform: translateX(-50%);
    border-radius: 2px;
}

/* LETTER */
.letter {
    position: absolute;
    width: 340px;
    padding: 22px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    cursor: pointer;
    z-index: 10;
    text-align: center;
    transition: transform 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);
}

.letter.open {
    transform: translate(-50%, -50%) scale(1.05);
}

.letter h2 {
    margin: 0 0 10px;
    color: #d63384;
    opacity: 0;
    animation: fadeIn 0.8s forwards;
    animation-delay: 0.3s;
}

.letter p {
    font-size: 15px;
    color: #444;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 0.8s forwards;
    animation-delay: 0.6s;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* BOUQUETS */
.bouquet {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    z-index: 9;
}

.left { left: -350px; animation: slideLeft 1.6s forwards; }
.right { right: -350px; animation: slideRight 1.6s forwards; }

@keyframes slideLeft { to { left: 20px; } }
@keyframes slideRight { to { right: 20px; } }
</style>
</head>

<body>

<div class="letter" onclick="openLetter()">
    <h3>Tap to open 💌</h3>
</div>

<div class="bouquet left" id="leftBouquet"></div>
<div class="bouquet right" id="rightBouquet"></div>

<script>
/* CREATE ROSE */
function createRose(color) {
    const rose = document.createElement("div");
    rose.className = `rose ${color}`;

    const flower = document.createElement("div");
    flower.className = "flower";

    for (let i = 0; i < 5; i++) {
        const petal = document.createElement("div");
        petal.className = "petal";
        flower.appendChild(petal);
    }
    for (let i = 0; i < 3; i++) {
        const inner = document.createElement("div");
        inner.className = "petal inner";
        flower.appendChild(inner);
    }

    const stem = document.createElement("div");
    stem.className = "stem";

    rose.appendChild(flower);
    rose.appendChild(stem);

    return rose;
}

/* SPAWN BACKGROUND ROSES */
function spawnBackgroundRose() {
    const rose = createRose(Math.random() > 0.5 ? "pink" : "white");
    rose.style.left = Math.random() * 100 + "vw";
    rose.style.animationDuration = 18 + Math.random() * 6 + "s";
    document.body.appendChild(rose);
    setTimeout(() => rose.remove(), 25000);
}

/* HEARTS */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = 6 + Math.random() * 4 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 16000);
}, 260);

/* NAME FLOAT */
setInterval(() => {
    const name = document.createElement("div");
    name.className = "name";
    name.innerText = "Maria";
    name.style.left = Math.random() * 70 + "vw";
    name.style.animationDuration = 20 + Math.random() * 8 + "s";
    document.body.appendChild(name);
    setTimeout(() => name.remove(), 26000);
}, 5200);

/* BACKGROUND ROSES */
setInterval(spawnBackgroundRose, 900);

/* LETTER OPEN */
function openLetter() {
    const letter = document.querySelector(".letter");
    letter.classList.add("open");
    letter.innerHTML = `
        <h2>Dear sweetiee 💗</h2>
        <p>
        I know you love white and pink roses.<br>
        I can’t give them to you right now,
        so here they are — digitally made,
        with all my care.
        <br><br>
        Some feelings float like these roses and hearts,
        soft, gentle… and always thinking of you.
        </p>
    `;
    showBouquets();
}

/* BOUQUETS ON TAP */
function showBouquets() {
    const left = document.getElementById("leftBouquet");
    const right = document.getElementById("rightBouquet");

    left.style.display = "block";
    right.style.display = "block";

    // 6 original + 5 extra = 11 roses each
    for (let i = 0; i < 11; i++) {
        left.appendChild(createRose(i % 2 === 0 ? "pink" : "white"));
        right.appendChild(createRose(i % 2 === 0 ? "white" : "pink"));
    }
}
</script>

</body>
</html>
